<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PM Multiverse — Four Product Management Portfolios</title>
  <meta name="description" content="Four product-management portfolios — discovery, strategy, PRDs, metrics, prototypes and a working fintech MVP — in one explorable website.">
  <meta name="theme-color" content="#06070b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2306070b'/%3E%3Cpath d='M32 8l6 18 18 6-18 6-6 18-6-18-18-6 18-6z' fill='url(%23g)'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <div id="preloader" aria-hidden="true">
    <div class="pre-inner">
      <div class="pre-mark">✦</div>
      <div class="pre-count"><span id="pre-num">0</span>%</div>
      <div class="pre-label">Assembling the multiverse</div>
      <div class="pre-bar"><i id="pre-bar"></i></div>
    </div>
  </div>

  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>
  <div id="progress" aria-hidden="true"></div>

  <header class="nav" id="nav">
    <a class="brand" href="#/" aria-label="PM Multiverse home">
      <span class="brand-mark">✦</span>
      <span class="brand-text">PM<b>MULTIVERSE</b></span>
    </a>
    <nav class="nav-links" id="nav-links" aria-label="Projects"></nav>
    <div class="nav-actions">
      <button class="search-trigger" type="button" data-open-palette aria-label="Search everything (Ctrl+K)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm10 2-4.35-4.35"/></svg>
        <span>Search</span><kbd>Ctrl K</kbd>
      </button>
      <button class="menu-btn" type="button" id="menu-btn" aria-label="Open menu" aria-expanded="false"><i></i><i></i></button>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <div id="palette" class="palette" hidden role="dialog" aria-modal="true" aria-label="Search">
    <div class="palette-backdrop" data-close-palette></div>
    <div class="palette-box">
      <div class="palette-input">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm10 2-4.35-4.35"/></svg>
        <input id="palette-q" type="search" placeholder="Search every document, file and project…" autocomplete="off" spellcheck="false" aria-label="Search query">
        <kbd>Esc</kbd>
      </div>
      <div id="palette-results" class="palette-results" role="listbox"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
    <button class="lb-close" type="button" data-lb="close" aria-label="Close">✕</button>
    <button class="lb-nav lb-prev" type="button" data-lb="prev" aria-label="Previous image">‹</button>
    <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
    <button class="lb-nav lb-next" type="button" data-lb="next" aria-label="Next image">›</button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><div class="noscript">This website needs JavaScript enabled to display the portfolios.</div></noscript>

  <script src="data/portfolio.js"></script>
  <script src="assets/js/fx.js"></script>
  <script src="assets/js/moneyflow.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
